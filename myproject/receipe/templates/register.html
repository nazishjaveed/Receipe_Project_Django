{% extends "base.html" %}

{% block start %}

<div class="container">

    <h3>Register here</h3>

    {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <div class="form-group">

            <label for="first_name">
                First Name
            </label>

            <input
                type="text"
                class="form-control"
                name="first_name"
                id="first_name"
            >

        </div>


        <div class="form-group">

            <label for="last_name">
                Last Name
            </label>

            <input
                type="text"
                class="form-control"
                name="last_name"
                id="last_name"
            >

        </div>


        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                class="form-control"
                name="username"
                id="username"
            >

        </div>


        <div class="form-group">

            <label for="email">
                Email address
            </label>

            <input
                type="email"
                class="form-control"
                name="email"
                id="email"
                aria-describedby="emailHelp"
            >

            <small id="emailHelp" class="form-text text-muted">
                We'll never share your email with anyone else.
            </small>

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                id="password"
            >

        </div>


        <button type="submit" class="btn btn-primary">
            Submit
        </button>

    </form>

    <p>
        Already have an account?
        <a href="/login/">Login</a>
    </p>

</div>

{% endblock %}
