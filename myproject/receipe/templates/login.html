{% extends "base.html" %}

{% block start %}

<div class="container">

    <h3>Login</h3>

    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-{{ message.tags }}" role="alert">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <form method="post" enctype="multipart/form-data">

        {% csrf_token %}

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                class="form-control"
                name="username"
                id="username"
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                class="form-control"
                name="password"
                id="password"
            >

        </div>


        <button type="submit" class="btn btn-primary">
            Submit
        </button>

    </form>


    <p>
        Don't have an account?
        <a href="/register/">Register</a>
    </p>

</div>

{% endblock %}
